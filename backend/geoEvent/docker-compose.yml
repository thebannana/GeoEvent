name: geoevent

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: geoevent-rabbitmq
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-user:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-user
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_user_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-event:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-event
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_event_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-ticket:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-ticket
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "768"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_ticket_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-notification
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "768"
    ports:
      - "1436:1433"
    volumes:
      - sqlserver_notification_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-message:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-message
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "768"
    ports:
      - "1437:1433"
    volumes:
      - sqlserver_message_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  sqlserver-location:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-location
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "768"
    ports:
      - "1438:1433"
    volumes:
      - sqlserver_location_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - geoevent-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: geoevent-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - geoevent-network

  user-service:
    build:
      context: .
      dockerfile: src/UserService/UserService.API/Dockerfile
    image: geoevent-user-service:1.0.0
    container_name: geoevent-user-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserDb: ${USER_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Services__EventService: ${EVENT_SERVICE_BASE_URL}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
    depends_on:
      sqlserver-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      event-service:
        condition: service_started
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

  event-service:
    build:
      context: .
      dockerfile: src/EventService/EventService.API/Dockerfile
    image: geoevent-event-service:1.0.0
    container_name: geoevent-event-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventDb: ${EVENT_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Services__UserServiceBaseUrl: ${USER_SERVICE_BASE_URL}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
      SupabaseStorage__Url: ${SUPABASE_URL}
      SupabaseStorage__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
      SupabaseStorage__Bucket: ${SUPABASE_BUCKET}
      SupabaseStorage__Folder: ${SUPABASE_FOLDER}
    depends_on:
      sqlserver-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geoevent-network

  ticket-service:
    build:
      context: .
      dockerfile: src/TicketService/TicketService.API/Dockerfile
    image: geoevent-ticket-service:1.0.0
    container_name: geoevent-ticket-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TicketDb: ${TICKET_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Services__UserService: ${USER_SERVICE_BASE_URL}
      Services__EventService: ${EVENT_SERVICE_BASE_URL}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
    depends_on:
      sqlserver-ticket:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.API/Dockerfile
    image: geoevent-notification-service:1.0.0
    container_name: geoevent-notification-service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationDb: ${NOTIFICATION_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      InternalApi__Key: ${INTERNAL_API_KEY}
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

  message-service:
    build:
      context: .
      dockerfile: src/MessageService/MessageService.API/Dockerfile
    image: geoevent-message-service:1.0.0
    container_name: geoevent-message-service
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MessageDb: ${MESSAGE_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
      Services__UserServiceBaseUrl: ${USER_SERVICE_BASE_URL}
      Services__EventServiceBaseUrl: ${EVENT_SERVICE_BASE_URL}
      InternalApi__Key: ${INTERNAL_API_KEY}
    depends_on:
      sqlserver-message:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

  location-service:
    build:
      context: .
      dockerfile: src/LocationService/LocationService.API/Dockerfile
    image: geoevent-location-service:1.0.0
    container_name: geoevent-location-service
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LocationDb: ${LOCATION_DB_CONNECTION}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
    depends_on:
      sqlserver-location:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geoevent-network

  helper-workers:
    build:
      context: .
      dockerfile: src/HelperWorkers/GeoEvent.HelperWorkers/Dockerfile
    image: geoevent-helper-workers:1.0.0
    container_name: geoevent-helper-workers
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      ConnectionStrings__UserDb: ${USER_DB_CONNECTION}
      ConnectionStrings__NotificationDb: ${NOTIFICATION_DB_CONNECTION}
      ConnectionStrings__TicketDb: ${TICKET_DB_CONNECTION}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__UseSsl: ${SMTP_ENABLE_SSL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Services__EventService: ${EVENT_SERVICE_BASE_URL}
      Services__NotificationService__BaseUrl: ${NOTIFICATION_SERVICE_BASE_URL}
      Services__NotificationService__InternalApiKey: ${INTERNAL_API_KEY}
      Services__MessageService__BaseUrl: ${MESSAGE_SERVICE_BASE_URL}
      Services__MessageService__InternalApiKey: ${INTERNAL_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver-user:
        condition: service_healthy
      sqlserver-ticket:
        condition: service_healthy
      sqlserver-notification:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      ticket-service:
        condition: service_started
      notification-service:
        condition: service_started
      message-service:
        condition: service_started
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/ApiGateway/Dockerfile
    image: geoevent-api-gateway:1.0.0
    container_name: geoevent-api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2}
      ReverseProxy__Clusters__user-cluster__Destinations__user-service__Address: ${USER_SERVICE_BASE_URL}
      ReverseProxy__Clusters__event-cluster__Destinations__event-service__Address: ${EVENT_SERVICE_BASE_URL}
      ReverseProxy__Clusters__ticket-cluster__Destinations__ticket-service__Address: ${TICKET_SERVICE_BASE_URL}
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: ${NOTIFICATION_SERVICE_BASE_URL}
      ReverseProxy__Clusters__message-cluster__Destinations__message-service__Address: ${MESSAGE_SERVICE_BASE_URL}
    depends_on:
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      ticket-service:
        condition: service_started
      notification-service:
        condition: service_started
      message-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - geoevent-network

volumes:
  rabbitmq_data:
  sqlserver_user_data:
  sqlserver_event_data:
  sqlserver_ticket_data:
  sqlserver_notification_data:
  sqlserver_message_data:
  sqlserver_location_data:

networks:
  geoevent-network:
    driver: bridge