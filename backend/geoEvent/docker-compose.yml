services:

  # ── RabbitMQ ────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: geoevent-rabbitmq
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geoevent-network

  # ── SQL Server Instances ─────────────────────────────────────────
  sqlserver-user:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-user
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_user_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  sqlserver-event:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-event
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_event_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  sqlserver-ticket:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-ticket
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_ticket_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-notification
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1436:1433"
    volumes:
      - sqlserver_notification_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  sqlserver-message:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-message
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1437:1433"
    volumes:
      - sqlserver_message_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  sqlserver-location:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geoevent-sqlserver-location
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1438:1433"
    volumes:
      - sqlserver_location_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - geoevent-network

  # ── Services ─────────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: src/UserService/UserService.API/Dockerfile
    container_name: geoevent-user-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__UserDb: "Server=sqlserver-user,1433;Database=UserDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoevent-network

  event-service:
    build:
      context: .
      dockerfile: src/EventService/EventService.API/Dockerfile
    container_name: geoevent-event-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__EventDb: "Server=sqlserver-event,1433;Database=EventDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoevent-network

  ticket-service:
    build:
      context: .
      dockerfile: src/TicketService/TicketService.API/Dockerfile
    container_name: geoevent-ticket-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TicketDb: "Server=sqlserver-ticket,1433;Database=TicketDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-ticket:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoevent-network

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.API/Dockerfile
    container_name: geoevent-notification-service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NotificationDb: "Server=sqlserver-notification,1433;Database=NotificationDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoevent-network

  message-service:
    build:
      context: .
      dockerfile: src/MessageService/MessageService.API/Dockerfile
    container_name: geoevent-message-service
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MessageDb: "Server=sqlserver-message,1433;Database=MessageDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-message:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoevent-network

  location-service:
    build:
      context: .
      dockerfile: src/LocationService/LocationService.API/Dockerfile
    container_name: geoevent-location-service
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__LocationDb: "Server=sqlserver-location,1433;Database=LocationDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      sqlserver-location:
        condition: service_healthy
    networks:
      - geoevent-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/ApiGateway/Dockerfile
    container_name: geoevent-api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ReverseProxy__Clusters__user-cluster__Destinations__user-service__Address: http://user-service:8080
      ReverseProxy__Clusters__event-cluster__Destinations__event-service__Address: http://event-service:8080
      ReverseProxy__Clusters__ticket-cluster__Destinations__ticket-service__Address: http://ticket-service:8080
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: http://notification-service:8080
      ReverseProxy__Clusters__message-cluster__Destinations__message-service__Address: http://message-service:8080
      ReverseProxy__Clusters__location-cluster__Destinations__location-service__Address: http://location-service:8080
    depends_on:
      - user-service
      - event-service
      - ticket-service
      - notification-service
      - message-service
      - location-service
    networks:
      - geoevent-network

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  rabbitmq_data:
  sqlserver_user_data:
  sqlserver_event_data:
  sqlserver_ticket_data:
  sqlserver_notification_data:
  sqlserver_message_data:
  sqlserver_location_data:

# ── Network ───────────────────────────────────────────────────────
networks:
  geoevent-network:
    driver: bridge