name: geo_event_desktop
description: "GeoEvent desktop administration application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^3.0.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  connectivity_plus: ^7.2.0
  windows_single_instance: ^1.0.1
  file_picker: ^8.0.0
  flex_color_picker: ^3.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  file_saver: ^0.2.14
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotties/